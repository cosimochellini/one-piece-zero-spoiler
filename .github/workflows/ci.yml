name: CI

on:
  push:
    branches: [main]
  # `edited` is not a default activity type, and without it a title changed
  # after the first green run would never be re-validated: the pr-title check
  # would stay green for a title semantic-release cannot read.
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  # On push the group collapses to a single constant, so releases on main are
  # serialized: a second merge waits for the first one's tag instead of racing
  # it. Pull request runs are keyed per pull request and stay independent.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Only pull request runs are disposable. A push to main can be carrying a
  # release, and cancelling that mid-flight would leave a tag without its
  # package.json bump, so those runs always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: 'true'
  # Silence fallow's background update check so no gate step touches the network.
  FALLOW_UPDATE_CHECK: 'off'
  REACT_DOCTOR_NO_COLOR: '1'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_AUDIT: 'false'
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  # The pull request title is the only input to the version bump: GitHub
  # squashes the branch into one commit on main whose subject is that title,
  # and semantic-release reads it to pick patch / minor / major. This job runs
  # without `npm ci` because the validator has no dependencies.
  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # The title goes through `env`, never through `${{ }}` inside the shell
      # script: a PR title is attacker-controlled and would be interpolated
      # before the shell ever sees it as data.
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/validate-pr-title.mjs

  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: fallow's health pass reads the git log for churn
          # hotspots.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # setup-node pins Node only. package.json pins npm through
      # `packageManager`, and corepack is what actually enforces it, so
      # without this step CI runs whichever npm ships with the Node build.
      - name: Pin npm
        run: |
          corepack enable npm
          npm --version

      # Never add --omit=optional: fallow ships its binary through
      # optionalDependencies and bin/fallow resolves it at runtime.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: react-doctor gate
        run: npm run gate:react-doctor

      - name: fallow gate
        run: npm run gate:fallow

      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-reports
          path: .gate/
          if-no-files-found: ignore
          retention-days: 7

  # Cuts the release for every push to main, which in practice means every
  # squashed pull request. Gated on `check` so a red build never tags.
  release:
    name: release
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write # push the version commit, create the tag
      issues: write # comment on issues closed by the release
      pull-requests: write # comment on the released pull requests

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # semantic-release walks the full history and every tag to work out
          # the previous version.
          fetch-depth: 0
          # @semantic-release/git pushes the version commit back with these
          # credentials.
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Installed through npx rather than devDependencies: this pulls ~250
      # packages that no other job, and no local `npm install`, has any use
      # for. Versions are pinned, so the run stays reproducible.
      #
      # commit-analyzer, release-notes-generator, npm and github ship inside
      # semantic-release itself. The `conventionalcommits` preset does not
      # (commit-analyzer only depends on conventional-changelog-angular), and
      # neither does the git plugin, so both are listed.
      #
      # The preset is held at 9.x on purpose. 10.x requires
      # conventional-changelog-writer@9, while release-notes-generator@14
      # still depends on ^8, and the mismatch only surfaces at release time as
      # `Missing helper: "conventional-changelog-conventionalcommits requires
      # conventional-changelog-writer@9 or newer"`. Raise it once
      # release-notes-generator ships a writer@9 dependency.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          npx --yes \
            -p semantic-release@25.0.9 \
            -p @semantic-release/git@11.0.1 \
            -p conventional-changelog-conventionalcommits@9.3.1 \
            semantic-release
