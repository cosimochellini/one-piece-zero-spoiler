name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: 'true'
  # Silence fallow's background update check so no gate step touches the network.
  FALLOW_UPDATE_CHECK: 'off'
  REACT_DOCTOR_NO_COLOR: '1'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_AUDIT: 'false'
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: fallow's health pass reads the git log for churn
          # hotspots.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # setup-node pins Node only. package.json pins npm through
      # `packageManager`, and corepack is what actually enforces it, so
      # without this step CI runs whichever npm ships with the Node build.
      - name: Pin npm
        run: |
          corepack enable npm
          npm --version

      # Never add --omit=optional: fallow ships its binary through
      # optionalDependencies and bin/fallow resolves it at runtime.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: react-doctor gate
        run: npm run gate:react-doctor

      - name: fallow gate
        run: npm run gate:fallow

      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-reports
          path: .gate/
          if-no-files-found: ignore
          retention-days: 7
