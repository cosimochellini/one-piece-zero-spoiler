name: CI

on:
  push:
    branches: [main]
  # No `edited`: a title or body edit would cancel the run in flight and pay
  # for the whole gate again. The title is checked by pr-title.yml instead.
  # A re-run reuses the old payload, so a body edit that adds a
  # `client-budget:` line takes effect on the next push or a close and reopen.
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  # On push the group collapses to a single constant, so releases on main are
  # serialized: a second merge waits for the first one's tag instead of racing
  # it. Pull request runs are keyed per pull request and stay independent.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Only pull request runs are disposable. A push to main can be carrying a
  # release, and cancelling that mid-flight would leave a tag without its
  # package.json bump, so those runs always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: 'true'
  # Silence fallow's background update check so no gate step touches the network.
  FALLOW_UPDATE_CHECK: 'off'
  REACT_DOCTOR_NO_COLOR: '1'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_AUDIT: 'false'
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  # No git hooks in CI. lefthook's own installer already skips when CI is set;
  # this also stops the release job's `chore(release)` commit, whose body is the
  # generated notes, from being judged by commitlint.
  LEFTHOOK: '0'

jobs:
  check:
    name: check
    # Pull requests only: the gate already ran there, and repeating it on main
    # just to bump the version cost the whole run for nothing.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: fallow's health pass reads the git log for churn
          # hotspots.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # setup-node pins Node only. package.json pins npm through
      # `packageManager`, and corepack is what actually enforces it, so
      # without this step CI runs whichever npm ships with the Node build.
      - name: Pin npm
        run: |
          corepack enable npm
          npm --version

      # Never add --omit=optional: fallow ships its binary through
      # optionalDependencies and bin/fallow resolves it at runtime.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: docs counts gate
        run: npm run gate:docs

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: react-doctor gate
        run: npm run gate:react-doctor

      - name: fallow gate
        run: npm run gate:fallow

      # Reads the built client chunks, so it has to follow the build.
      - name: archive gate
        run: npm run gate:archive

      # The base build is a pure function of the base commit, so it is cached
      # by SHA: later pushes to the same PR skip a second `npm ci` and build.
      - name: Restore PR base build
        if: github.event_name == 'pull_request'
        id: base-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/client-base
          key:
            client-base-${{ github.event.pull_request.base.sha || github.sha }}

      # A separate worktree leaves the head build intact. Use the event's exact
      # base commit, not today's main, and install its own pinned dependencies.
      - name: Build PR base
        if:
          github.event_name == 'pull_request' &&
          steps.base-cache.outputs.cache-hit != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/client-budget-base" "$BASE_SHA"
          cd "$RUNNER_TEMP/client-budget-base"
          npm ci
          npm run build
          cp -r dist/client "$RUNNER_TEMP/client-base"

      - name: Client growth budget
        if: github.event_name == 'pull_request'
        env:
          # PR prose is data, never interpolated into the shell script.
          PR_BODY: ${{ github.event.pull_request.body }}
        run:
          node scripts/client-budget.mjs "$RUNNER_TEMP/client-base" dist/client

      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-reports
          path: .gate/
          if-no-files-found: ignore
          retention-days: 7

  # Cuts the release for every push to main, which in practice means every
  # squashed pull request. It does not wait for `check`, which only runs on
  # pull requests; a merge of two green PRs that break each other still tags.
  #
  # This job is also why `main` carries no branch protection. A ruleset that
  # requires a pull request would reject the `chore(release)` commit pushed
  # below as well, and adding `github-actions` to the bypass list is rejected
  # on a personal repository. Protecting the branch costs either a deploy key
  # held as a secret or dropping the package.json version bump.
  release:
    name: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: write # push the version commit, create the tag
      issues: write # comment on issues closed by the release
      pull-requests: write # comment on the released pull requests

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # semantic-release walks the full history and every tag to work out
          # the previous version.
          fetch-depth: 0
          # @semantic-release/git pushes the version commit back with these
          # credentials.
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Recovering a half-finished release: if this step dies between tagging
      # and publishing, the tag and the version commit land but the GitHub
      # Release does not, and the next merge will not backfill it because its
      # commits are already released. Create it by hand:
      #   gh release create vX.Y.Z --generate-notes
      #
      # Installed through npx rather than devDependencies: this pulls ~250
      # packages that no other job, and no local `npm install`, has any use
      # for. Versions are pinned, so the run stays reproducible.
      #
      # commit-analyzer, release-notes-generator, npm and github ship inside
      # semantic-release itself. The `conventionalcommits` preset does not
      # (commit-analyzer only depends on conventional-changelog-angular), and
      # neither does the git plugin, so both are listed.
      #
      # The preset is held at 9.x on purpose. 10.x requires
      # conventional-changelog-writer@9, while release-notes-generator@14
      # still depends on ^8, and the mismatch only surfaces at release time as
      # `Missing helper: "conventional-changelog-conventionalcommits requires
      # conventional-changelog-writer@9 or newer"`. Raise it once
      # release-notes-generator ships a writer@9 dependency.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          npx --yes \
            -p semantic-release@25.0.9 \
            -p @semantic-release/git@11.0.1 \
            -p conventional-changelog-conventionalcommits@9.3.1 \
            semantic-release

      # The README health badge. It runs after the release so it scores the
      # commit that carries the version bump, and it never fails the job: the
      # tag is already out, and a red run here would only be noise. A failure
      # leaves the previous badge in place, so check the job log if it looks stale.
      # `npm test` writes the coverage fallow reads for the CRAP score, so the
      # grade matches the one the pull request gate sees.
      - name: Install for badge
        continue-on-error: true
        run: npm ci

      - name: Test for badge
        continue-on-error: true
        run: npm test

      # fallow exits 1 when a health gate trips but still writes the badge, so
      # only a missing or empty file counts as a failure. The SVG goes to an
      # orphan `badges` branch holding a single commit, force-pushed each time,
      # so the history never grows. The push uses GITHUB_TOKEN, which starts no
      # workflow.
      - name: Publish health badge
        continue-on-error: true
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          status=0
          ./node_modules/.bin/fallow health --format badge > "$RUNNER_TEMP/badge.svg" || status=$?
          if [ "$status" -gt 1 ] || [ ! -s "$RUNNER_TEMP/badge.svg" ]; then
            echo "fallow health produced no badge (exit $status)" >&2
            exit 1
          fi
          git worktree add --orphan -b badges "$RUNNER_TEMP/badges"
          cp "$RUNNER_TEMP/badge.svg" "$RUNNER_TEMP/badges/badge.svg"
          cd "$RUNNER_TEMP/badges"
          git add badge.svg
          git commit -m 'chore: update health badge'
          git push --force origin badges
