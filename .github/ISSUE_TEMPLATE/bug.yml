name: Bug report
description: Something on the site or in the tooling does not work.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page
      placeholder: https://one-piece-zero-spoiler.netlify.app/en/...
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Firefox 140 on Android
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
