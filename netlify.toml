# Netlify serves the old one-piece-zero-spoiler.netlify.app address until it
# is switched off. The site itself runs on Cloudflare (wrangler.jsonc). Cache
# headers for static files are in public/_headers, which both hosts read.
[build]
  command = "npm run build"
  publish = "dist/client"

[build.environment]
  # Mirrors .nvmrc, which Netlify also reads. Declared explicitly so the
  # runtime is visible in the deploy config itself.
  NODE_VERSION = "24.21.0"
