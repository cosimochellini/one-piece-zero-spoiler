# The site runs on Cloudflare (wrangler.jsonc). Netlify keeps the old
# one-piece-zero-spoiler.netlify.app address only to send every request to the
# new domain, so old links and search results still land on the right page.
# Nothing is built: the forced rule shadows every published file, and Netlify
# appends the request's query, so a shared `?ch=1044` link still sets its
# bookmark on arrival.
[build]
  command = "echo 'Redirect only, nothing to build.'"
  publish = "public"

[[redirects]]
  from = "/*"
  to = "https://zerospoiler.app/:splat"
  status = 301
  force = true
